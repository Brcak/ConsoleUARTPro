name: Windows EXE
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/windows-exe.yml'
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore tests/ConsoleUARTPro.Tests/ConsoleUARTPro.Tests.csproj
      - name: Test
        run: dotnet test tests/ConsoleUARTPro.Tests/ConsoleUARTPro.Tests.csproj -c Release --no-restore
      - name: Publish Windows EXE
        run: dotnet publish src/ConsoleUARTPro/ConsoleUARTPro.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: ConsoleUARTPro-win-x64
          path: publish/**
